<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PEA Assistant Chat</title>
</head>
<body style="font-family: sans-serif;">

    <h2>PEA Assistant (DSPy ReAct Agent)</h2>
    <div style="margin-bottom: 10px; font-size: 12px; color: gray;">
        Session ID: <span id="displaySessionId">กำลังโหลด...</span>
    </div>
    
    <div style="display: flex; gap: 15px; margin-bottom: 10px;">
        
        <div style="flex: 2;">
            <div id="chatBox" style="height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px;">
                <div><b>Agent:</b> สวัสดีครับ! มีอะไรให้ผมช่วยเกี่ยวกับ PEA ไหมครับ?</div>
            </div>

            <input type="text" id="userInput" placeholder="พิมพ์ข้อความที่นี่..." onkeypress="handleKeyPress(event)" style="width: 80%; padding: 5px;">
            <button id="sendBtn" onclick="sendMessage()" style="padding: 5px 10px;">ส่ง</button>
        </div>

        <div style="flex: 1; border: 1px solid #ccc; padding: 10px; background-color: #f9f9f9; height: 300px; overflow-y: auto;">
            <b>Current State:</b>
            <hr style="border: 0; border-top: 1px solid #ddd;">
            <pre id="stateBox" style="font-size: 12px; margin: 0; white-space: pre-wrap; color: #333;">รอข้อมูล State...</pre>
        </div>
        
    </div>

<script>
    const API_URL = "http://192.168.28.47:8001/ask";
    const NOTIFICATIONS_URL = "http://192.168.28.47:8001/notifications";
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const stateBox = document.getElementById("stateBox"); // อ้างอิงกล่อง State

    // 1. ระบบจำ Session ID ประจำตัวผู้ใช้
    function getOrCreateSessionId() {
        let sessionId = localStorage.getItem('pea_chat_session_id');
        
        if (!sessionId) {
            sessionId = 'user_' + Math.random().toString(31).substr(2, 9);
            localStorage.setItem('pea_chat_session_id', sessionId);
        }
        return sessionId;
    }

    const currentSessionId = getOrCreateSessionId();
    document.getElementById("displaySessionId").innerText = currentSessionId;

    async function pollNotifications() {
        try {
            const response = await fetch(`${NOTIFICATIONS_URL}/${currentSessionId}`);
            const data = await response.json();
            if (response.ok && data.notifications) {
                data.notifications.forEach((notification) => {
                    appendMessage(notification.message, false);
                });
            }
        } catch (error) {
            console.error(error);
        }
    }

    setInterval(pollNotifications, 2000);

    function appendMessage(text, isUser) {
        const msgDiv = document.createElement("div");
        msgDiv.style.marginBottom = "8px";
        msgDiv.innerHTML = `<b>${isUser ? 'You' : 'Agent'}:</b> ${text}`;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage(text, true);
        userInput.value = "";
        userInput.disabled = true;
        sendBtn.disabled = true;

        const loadingDiv = document.createElement("div");
        loadingDiv.innerHTML = "<b>Agent:</b> กำลังประมวลผล...";
        chatBox.appendChild(loadingDiv);

        try {
            // 2. แนบ session_id ไปกับ Body ทุกครั้งที่ยิง API
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    question: text,
                    session_id: currentSessionId 
                })
            });

            const data = await response.json();
            loadingDiv.remove();

            if (response.ok) {
                // แสดงคำตอบในช่องแชท
                appendMessage(data.answer, false);
                
                // ดึงข้อมูล State มาแสดงผล
                if (data.state) {
                    // JSON.stringify(ข้อมูล, null, 2) ช่วยจัดฟอร์แมตให้อ่านง่าย
                    stateBox.innerText = JSON.stringify(data.state, null, 2);
                } else {
                    stateBox.innerText = "ไม่พบข้อมูล State จาก Agent";
                }
            } else {
                appendMessage("เกิดข้อผิดพลาด: " + (data.detail || "ไม่สามารถติดต่อระบบได้"), false);
            }
        } catch (error) {
            loadingDiv.remove();
            appendMessage("เกิดข้อผิดพลาดในการเชื่อมต่อระบบเครือข่าย", false);
            console.error(error);
        } finally {
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }
</script>

</body>
</html>
