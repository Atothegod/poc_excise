<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>ศูนย์รับแจ้งปัญหา PEA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            color-scheme: light;
            --pea-purple: #733190;
            --chat-bg: #8baecf;
            --user-bubble: #8ce071;
            --panel-bg: #f5f5f7;
            --line: rgba(35, 39, 47, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            overscroll-behavior-y: none;
            background:
                radial-gradient(circle at 12% 16%, rgba(115, 49, 144, 0.22), transparent 32%),
                radial-gradient(circle at 88% 18%, rgba(140, 224, 113, 0.20), transparent 28%),
                linear-gradient(135deg, #edf2f7, #dfe7f0);
            font-family: Inter, "Segoe UI", Tahoma, sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        .page-shell {
            min-height: 100dvh;
            display: grid;
            grid-template-columns: minmax(340px, 430px) minmax(340px, 430px);
            gap: 18px;
            align-items: stretch;
            justify-content: center;
            padding: 18px;
        }

        .app-container {
            height: calc(100dvh - 36px);
            min-height: 620px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 8px;
            background: var(--chat-bg);
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.24);
        }

        .state-panel {
            height: calc(100dvh - 36px);
            min-height: 620px;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.82);
            box-shadow: 0 20px 58px rgba(15, 23, 42, 0.14);
            backdrop-filter: blur(16px);
        }

        body.state-hidden .state-panel {
            display: none;
        }

        body.state-hidden .page-shell {
            grid-template-columns: minmax(340px, 430px);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .chat-bubble-left::before {
            content: "";
            position: absolute;
            top: 10px;
            left: -6px;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-right: 8px solid #ffffff;
        }

        .chat-bubble-right::before {
            content: "";
            position: absolute;
            top: 10px;
            right: -6px;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-left: 8px solid var(--user-bubble);
        }

        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 8px);
        }

        .session-meta-bar {
            display: grid;
            gap: 6px;
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.24);
            background: rgba(115, 49, 144, 0.92);
            color: white;
            font-size: 12px;
        }

        .session-meta-line {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .session-meta-label {
            width: 52px;
            flex: 0 0 auto;
            color: rgba(255, 255, 255, 0.72);
            font-weight: 700;
            text-transform: uppercase;
        }

        .session-meta-value {
            min-width: 0;
            flex: 1 1 auto;
            overflow-x: auto;
            white-space: nowrap;
            font-family: "SFMono-Regular", Consolas, monospace;
            scrollbar-width: none;
        }

        .session-meta-value::-webkit-scrollbar {
            display: none;
        }

        .state-box {
            min-height: 0;
            overflow: auto;
            border-top: 1px solid var(--line);
            padding: 16px;
            color: #1f2937;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 12px;
            line-height: 1.65;
            white-space: pre-wrap;
        }

        .state-box::-webkit-scrollbar {
            width: 10px;
        }

        .state-box::-webkit-scrollbar-thumb {
            border: 3px solid transparent;
            border-radius: 999px;
            background: rgba(100, 116, 139, 0.36);
            background-clip: padding-box;
        }

        .typing-dot {
            animation: pulseDot 1s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 140ms;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 280ms;
        }

        @keyframes pulseDot {
            0%,
            80%,
            100% {
                transform: translateY(0);
                opacity: 0.45;
            }
            40% {
                transform: translateY(-3px);
                opacity: 1;
            }
        }

        @media (max-width: 900px) {
            .page-shell {
                min-height: 100dvh;
                grid-template-columns: 1fr;
                gap: 0;
                padding: 0;
            }

            body.state-hidden .page-shell {
                grid-template-columns: 1fr;
            }

            .app-container {
                width: 100%;
                height: 100dvh;
                min-height: 0;
                border: 0;
                border-radius: 0;
                box-shadow: none;
            }

            .state-panel {
                height: min(42dvh, 360px);
                min-height: 260px;
                border-right: 0;
                border-bottom: 0;
                border-left: 0;
                border-radius: 0;
                box-shadow: none;
            }
        }

        @media (max-width: 420px) {
            .bubble {
                max-width: 248px;
            }
        }
    </style>
</head>
<body>
    <main class="page-shell">
        <section class="app-container w-full flex flex-col relative">
            <header class="bg-[#733190] text-white flex items-center px-4 py-3 shrink-0 z-10 shadow-md">
                <button
                    class="mr-3 active:opacity-70 transition-opacity focus:outline-none"
                    type="button"
                    onclick="toggleStatePanel()"
                    aria-label="Toggle agent state"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m15 18-6-6 6-6"/>
                    </svg>
                </button>

                <div class="flex items-center flex-1 min-w-0">
                    <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center mr-3 overflow-hidden border-2 border-white/20 shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 text-[#733190]">
                            <path fill-rule="evenodd" d="M14.615 1.595a.75.75 0 01.359.852L12.982 9.75h7.268a.75.75 0 01.548 1.262l-10.5 11.25a.75.75 0 01-1.272-.71l1.992-7.302H3.75a.75.75 0 01-.548-1.262l10.5-11.25a.75.75 0 01.913-.143z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <div class="min-w-0">
                        <h1 class="font-bold text-lg leading-none truncate">ศูนย์รับแจ้งปัญหา</h1>
                    </div>
                </div>

                <button
                    id="state-toggle"
                    class="text-xs font-semibold bg-white/15 hover:bg-white/25 px-3 py-1.5 rounded-full active:opacity-70 transition-all focus:outline-none shadow-sm mr-2"
                    type="button"
                    onclick="toggleStatePanel()"
                >
                    State
                </button>
                <button
                    id="reset-btn"
                    class="text-sm font-medium bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full active:opacity-70 transition-all focus:outline-none shadow-sm"
                    type="button"
                >
                    เริ่มใหม่
                </button>
            </header>

            <div class="session-meta-bar shrink-0">
                <div class="session-meta-line">
                    <span class="session-meta-label">CA</span>
                    <span id="displayCaNumber" class="session-meta-value">กำลังโหลด...</span>
                </div>
                <div id="session-display-row" class="session-meta-line">
                    <span class="session-meta-label">Session</span>
                    <span id="displaySessionId" class="session-meta-value">กำลังโหลด...</span>
                    <button
                        id="edit-session-btn"
                        class="h-7 w-7 rounded-md bg-white/15 hover:bg-white/25 flex items-center justify-center shrink-0"
                        type="button"
                        aria-label="Edit session"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 20h9"/>
                            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                        </svg>
                    </button>
                </div>
                <div id="session-edit-row" class="session-meta-line hidden">
                    <span class="session-meta-label">Session</span>
                    <input
                        id="session-id-input"
                        class="h-8 min-w-0 flex-1 rounded-md border border-white/30 bg-white/95 px-2 text-xs text-gray-900 outline-none focus:border-white"
                        type="text"
                        autocomplete="off"
                        aria-label="Session ID"
                    >
                    <button id="save-session-btn" class="h-8 w-8 rounded-md bg-white/15 hover:bg-white/25 flex items-center justify-center shrink-0" type="button" aria-label="Save session">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 6 9 17l-5-5"/>
                        </svg>
                    </button>
                    <button id="cancel-session-btn" class="h-8 w-8 rounded-md bg-white/15 hover:bg-white/25 flex items-center justify-center shrink-0" type="button" aria-label="Cancel session edit">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 6 6 18"/>
                            <path d="m6 6 12 12"/>
                        </svg>
                    </button>
                </div>
            </div>

            <main id="chat-container" class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-4 flex flex-col bg-[#8baecf]" aria-live="polite">
                <div id="chat-spacer" class="h-2"></div>
            </main>

            <footer class="bg-[#f2f2f2] px-3 py-2 shrink-0 z-10 flex items-center gap-3 border-t border-gray-300 pb-safe">
                <button class="text-gray-500 hover:text-gray-700 focus:outline-none shrink-0 transition-colors" type="button" aria-label="Add">
                    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                </button>

                <button class="text-gray-500 hover:text-gray-700 focus:outline-none shrink-0 transition-colors" type="button" aria-label="Camera">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
                        <circle cx="12" cy="13" r="3"/>
                    </svg>
                </button>

                <button class="text-gray-500 hover:text-gray-700 focus:outline-none shrink-0 transition-colors" type="button" aria-label="Image">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                </button>

                <div class="flex-1 relative flex items-center bg-white rounded-full border border-gray-300 px-3 py-1.5 focus-within:border-gray-400 min-w-0">
                    <input
                        type="text"
                        id="message-input"
                        class="w-full bg-transparent outline-none text-sm text-gray-800 placeholder-gray-400 min-w-0"
                        placeholder="พิมพ์ปัญหาไฟฟ้าของคุณ"
                        autocomplete="off"
                    >
                    <button id="send-button" class="ml-2 text-blue-500 font-semibold focus:outline-none hidden" type="button" aria-label="Send message">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" class="text-blue-500">
                            <path d="M2 21l21-9L2 3v7l15 2-15 2v7z" />
                        </svg>
                    </button>
                </div>
            </footer>
        </section>

        <aside id="state-panel" class="state-panel">
            <div class="px-5 py-4 bg-white/90">
                <div class="flex items-start justify-between gap-3">
                    <div>
                        <h2 class="text-sm font-bold text-gray-900">Agent state</h2>
                        <p id="endpoint-label" class="mt-1 text-xs text-gray-500 break-all"></p>
                    </div>
                    <button class="rounded-full border border-gray-200 px-3 py-1 text-xs font-semibold text-gray-700 hover:bg-gray-50" type="button" onclick="toggleStatePanel()">Hide</button>
                </div>
            </div>
            <pre id="state-box" class="state-box">รอข้อมูล State...</pre>
        </aside>
    </main>

    <script>
        const configuredAgentBaseUrl = "{{ agent_base_url|escapejs }}";
        const agentBaseUrl = configuredAgentBaseUrl || "";
        const API_URL = agentBaseUrl ? `${agentBaseUrl}/ask` : "/agent/ask/";
        const NOTIFICATIONS_URL = agentBaseUrl ? `${agentBaseUrl}/notifications` : "/agent/notifications";
        const SESSION_LOGIN_URL = "/api/reports/session-login/";

        const chatContainer = document.getElementById("chat-container");
        const messageInput = document.getElementById("message-input");
        const sendButton = document.getElementById("send-button");
        const resetButton = document.getElementById("reset-btn");
        const stateBox = document.getElementById("state-box");
        const stateToggle = document.getElementById("state-toggle");
        const endpointLabel = document.getElementById("endpoint-label");
        const displaySessionId = document.getElementById("displaySessionId");
        const displayCaNumber = document.getElementById("displayCaNumber");
        const sessionDisplayRow = document.getElementById("session-display-row");
        const sessionEditRow = document.getElementById("session-edit-row");
        const sessionIdInput = document.getElementById("session-id-input");
        const editSessionButton = document.getElementById("edit-session-btn");
        const saveSessionButton = document.getElementById("save-session-btn");
        const cancelSessionButton = document.getElementById("cancel-session-btn");

        endpointLabel.textContent = agentBaseUrl || "Django agent proxy";

        const loggedInCaNumber = localStorage.getItem("pea_chat_ca_number") || "";
        const hasPdpaConsent = localStorage.getItem("pea_chat_pdpa_consent") === "true";
        const loginReady = /^\d{12}$/.test(loggedInCaNumber) && hasPdpaConsent;

        if (!loginReady) {
            window.location.replace("/");
        }

        const botLightningIcon = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 text-[#733190]">
                <path fill-rule="evenodd" d="M14.615 1.595a.75.75 0 01.359.852L12.982 9.75h7.268a.75.75 0 01.548 1.262l-10.5 11.25a.75.75 0 01-1.272-.71l1.992-7.302H3.75a.75.75 0 01-.548-1.262l10.5-11.25a.75.75 0 01.913-.143z" clip-rule="evenodd" />
            </svg>
        `;

        function createSessionId() {
            return "user_" + Math.random().toString(36).slice(2, 11);
        }

        function getOrCreateSessionId() {
            let sessionId = localStorage.getItem("pea_chat_session_id");
            if (!sessionId) {
                sessionId = createSessionId();
                localStorage.setItem("pea_chat_session_id", sessionId);
            }
            return sessionId;
        }

        let currentSessionId = getOrCreateSessionId();

        function setSessionId(sessionId) {
            currentSessionId = sessionId;
            localStorage.setItem("pea_chat_session_id", sessionId);
            displaySessionId.textContent = sessionId;
        }

        function isValidSessionId(sessionId) {
            return /^[A-Za-z0-9_.:-]{3,255}$/.test(sessionId);
        }

        function beginSessionEdit() {
            sessionIdInput.value = currentSessionId;
            sessionDisplayRow.classList.add("hidden");
            sessionEditRow.classList.remove("hidden");
            sessionEditRow.classList.add("flex");
            sessionIdInput.focus();
            sessionIdInput.select();
        }

        function cancelSessionEdit() {
            sessionEditRow.classList.add("hidden");
            sessionEditRow.classList.remove("flex");
            sessionDisplayRow.classList.remove("hidden");
        }

        async function saveEditedSession() {
            const nextSessionId = sessionIdInput.value.trim();
            if (!isValidSessionId(nextSessionId)) {
                stateBox.textContent = "Session ID ต้องใช้ตัวอักษร ตัวเลข หรือ . _ : - และยาวอย่างน้อย 3 ตัวอักษร";
                sessionIdInput.focus();
                return;
            }

            cancelSessionEdit();
            setSessionId(nextSessionId);
            initChat();
            await registerCurrentSession();
            messageInput.focus();
        }

        function formatTime() {
            return new Date().toLocaleTimeString("th-TH", {
                hour: "2-digit",
                minute: "2-digit"
            });
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function clearChat() {
            chatContainer.innerHTML = '<div id="chat-spacer" class="h-2"></div>';
        }

        function chatSpacer() {
            return document.getElementById("chat-spacer");
        }

        function initChat() {
            clearChat();
            stateBox.textContent = "รอข้อมูล State...";
            const timeString = formatTime();
            const initialHTML = `
                <div class="flex justify-center my-2">
                    <div class="bg-black/20 text-white text-[11px] px-3 py-1 rounded-full backdrop-blur-sm">วันนี้</div>
                </div>
                <div class="flex items-start">
                    <div class="w-9 h-9 bg-white rounded-full flex items-center justify-center mr-2 shrink-0 border border-gray-200 shadow-sm mt-1">
                        ${botLightningIcon}
                    </div>
                    <div class="flex flex-col min-w-0">
                        <span class="text-xs text-white/80 mb-1 ml-1">ศูนย์รับแจ้งปัญหา</span>
                        <div class="flex items-end">
                            <div class="chat-bubble-left bubble relative bg-white text-gray-800 text-sm py-2 px-3 rounded-2xl rounded-tl-md max-w-[280px] shadow-sm leading-relaxed whitespace-pre-wrap break-words">สวัสดีครับ แอดมินบอทยินดีให้บริการครับ

แจ้งปัญหาไฟฟ้าขัดข้องได้เลยครับ</div>
                            <span class="text-[10px] text-white/70 ml-2 mb-1">${timeString}</span>
                        </div>
                    </div>
                </div>
            `;
            chatSpacer().insertAdjacentHTML("beforebegin", initialHTML);
            scrollToBottom();
        }

        function applyStatePanelPreference() {
            const hidden = localStorage.getItem("pea_chat_state_hidden") === "true";
            document.body.classList.toggle("state-hidden", hidden);
            stateToggle.textContent = hidden ? "State" : "Hide";
            stateToggle.setAttribute("aria-expanded", String(!hidden));
        }

        function toggleStatePanel() {
            const nextHidden = !document.body.classList.contains("state-hidden");
            localStorage.setItem("pea_chat_state_hidden", String(nextHidden));
            applyStatePanelPreference();
        }

        async function resetSession() {
            setSessionId(createSessionId());
            initChat();
            await registerCurrentSession();
            messageInput.value = "";
            sendButton.classList.add("hidden");
            messageInput.focus();
        }

        function appendUserMessage(text) {
            const wrapper = document.createElement("div");
            wrapper.className = "flex items-start justify-end mt-4";

            const row = document.createElement("div");
            row.className = "flex items-end";

            const meta = document.createElement("div");
            meta.className = "flex flex-col items-end mr-2 mb-1";

            const read = document.createElement("span");
            read.className = "text-[10px] text-white/80 mb-0.5";
            read.textContent = "อ่านแล้ว";

            const time = document.createElement("span");
            time.className = "text-[10px] text-white/70";
            time.textContent = formatTime();

            const bubble = document.createElement("div");
            bubble.className = "chat-bubble-right bubble relative bg-[#8ce071] text-gray-900 text-sm py-2 px-3 rounded-2xl rounded-tr-md max-w-[280px] shadow-sm leading-relaxed whitespace-pre-wrap break-words";
            bubble.textContent = text;

            meta.appendChild(read);
            meta.appendChild(time);
            row.appendChild(meta);
            row.appendChild(bubble);
            wrapper.appendChild(row);
            chatSpacer().insertAdjacentElement("beforebegin", wrapper);
            scrollToBottom();
        }

        function appendBotMessage(text, options = {}) {
            const wrapper = document.createElement("div");
            wrapper.className = "flex items-start mt-4";

            const avatar = document.createElement("div");
            avatar.className = "w-9 h-9 bg-white rounded-full flex items-center justify-center mr-2 shrink-0 border border-gray-200 shadow-sm mt-1";
            avatar.innerHTML = botLightningIcon;

            const column = document.createElement("div");
            column.className = "flex flex-col min-w-0";

            const name = document.createElement("span");
            name.className = "text-xs text-white/80 mb-1 ml-1";
            name.textContent = options.label || "ศูนย์รับแจ้งปัญหา";

            const row = document.createElement("div");
            row.className = "flex items-end";

            const bubble = document.createElement("div");
            bubble.className = "chat-bubble-left bubble relative bg-white text-gray-800 text-sm py-2 px-3 rounded-2xl rounded-tl-md max-w-[280px] shadow-sm leading-relaxed whitespace-pre-wrap break-words";
            bubble.textContent = text;

            const time = document.createElement("span");
            time.className = "text-[10px] text-white/70 ml-2 mb-1";
            time.textContent = formatTime();

            row.appendChild(bubble);
            row.appendChild(time);
            column.appendChild(name);
            column.appendChild(row);
            wrapper.appendChild(avatar);
            wrapper.appendChild(column);
            chatSpacer().insertAdjacentElement("beforebegin", wrapper);
            scrollToBottom();
        }

        function appendLoadingMessage() {
            const wrapper = document.createElement("div");
            wrapper.className = "flex items-start mt-4";
            wrapper.setAttribute("aria-label", "Agent is preparing a response");

            const avatar = document.createElement("div");
            avatar.className = "w-9 h-9 bg-white rounded-full flex items-center justify-center mr-2 shrink-0 border border-gray-200 shadow-sm mt-1";
            avatar.innerHTML = botLightningIcon;

            const bubble = document.createElement("div");
            bubble.className = "chat-bubble-left relative bg-white text-gray-800 text-sm py-3 px-4 rounded-2xl rounded-tl-md shadow-sm";

            const dots = document.createElement("div");
            dots.className = "flex space-x-1";
            for (let i = 0; i < 3; i += 1) {
                const dot = document.createElement("div");
                dot.className = "typing-dot w-2 h-2 bg-gray-400 rounded-full";
                dots.appendChild(dot);
            }

            bubble.appendChild(dots);
            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            chatSpacer().insertAdjacentElement("beforebegin", wrapper);
            scrollToBottom();
            return wrapper;
        }

        function removeLoadingMessage(loadingMessage) {
            if (loadingMessage && loadingMessage.parentNode) {
                loadingMessage.parentNode.removeChild(loadingMessage);
            }
        }

        function setInputBusy(isBusy) {
            messageInput.disabled = isBusy;
            sendButton.disabled = isBusy;
        }

        function formatCaseTime(value) {
            if (!value) return null;
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return null;
            return date.toLocaleTimeString("th-TH", {
                hour: "2-digit",
                minute: "2-digit"
            });
        }

        function latestOutageSummary(outage) {
            if (!outage || outage.event_type === "restored") return null;

            const etrTime = formatCaseTime(outage.etr_target_time || outage.oms_etr);
            if (etrTime) {
                return `พบเคสที่เปิดอยู่สำหรับ CA นี้ครับ คาดว่าจะจ่ายไฟคืนประมาณ ${etrTime} น.`;
            }

            const etaTime = formatCaseTime(outage.eta_target_time);
            if (etaTime) {
                return `พบเคสที่เปิดอยู่สำหรับ CA นี้ครับ ช่างจะถึงหน้างานประมาณ ${etaTime} น.`;
            }

            return "พบเคสที่เปิดอยู่สำหรับ CA นี้ครับ ระบบกำลังรอข้อมูลเวลาอัปเดตล่าสุด";
        }

        function renderChatHistory(chatHistory) {
            if (!Array.isArray(chatHistory) || chatHistory.length === 0) {
                return false;
            }

            clearChat();
            chatSpacer().insertAdjacentHTML("beforebegin", `
                <div class="flex justify-center my-2">
                    <div class="bg-black/20 text-white text-[11px] px-3 py-1 rounded-full backdrop-blur-sm">ประวัติสนทนา</div>
                </div>
            `);

            chatHistory.forEach((item) => {
                const message = item.message || item.content || "";
                if (!message) return;

                if (item.role === "user") {
                    appendUserMessage(message);
                } else {
                    appendBotMessage(message, {
                        label: item.event_type ? "ระบบ OMS" : "ศูนย์รับแจ้งปัญหา"
                    });
                }
            });
            return true;
        }

        function applySessionContext(data) {
            const hasHistory = renderChatHistory(data.chat_history);
            if (!hasHistory) {
                const summary = latestOutageSummary(data.latest_outage);
                if (summary) {
                    appendBotMessage(summary);
                }
            }
            stateBox.textContent = JSON.stringify(
                {
                    session_id: currentSessionId,
                    ca_number: loggedInCaNumber,
                    latest_outage: data.latest_outage || null
                },
                null,
                2
            );
        }

        async function registerCurrentSession() {
            if (!loginReady) return;

            try {
                const response = await fetch(SESSION_LOGIN_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        session_id: currentSessionId,
                        ca_number: loggedInCaNumber,
                        pdpa_consent: true
                    })
                });
                const data = await response.json();

                if (response.ok) {
                    applySessionContext(data);
                } else {
                    appendBotMessage("ไม่สามารถลงทะเบียน Session นี้ได้ กรุณากลับไปหน้าเข้าสู่ระบบอีกครั้ง");
                    stateBox.textContent = JSON.stringify(data, null, 2);
                }
            } catch (error) {
                appendBotMessage("เกิดข้อผิดพลาดในการลงทะเบียน Session");
                stateBox.textContent = String(error);
            }
        }

        async function pollNotifications() {
            try {
                const response = await fetch(`${NOTIFICATIONS_URL}/${encodeURIComponent(currentSessionId)}`);
                const data = await response.json();
                if (response.ok && Array.isArray(data.notifications)) {
                    data.notifications.forEach((notification) => {
                        appendBotMessage(notification.message || "");
                    });
                }
            } catch (error) {
                console.error(error);
            }
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            appendUserMessage(text);
            const loadingMessage = appendLoadingMessage();
            messageInput.value = "";
            sendButton.classList.add("hidden");
            setInputBusy(true);

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        question: text,
                        session_id: currentSessionId,
                        ca_number: loggedInCaNumber,
                        pdpa_consent: true
                    })
                });

                const data = await response.json();
                removeLoadingMessage(loadingMessage);

                if (response.ok) {
                    appendBotMessage(data.answer || "ระบบตอบกลับว่างเปล่าครับ");
                    stateBox.textContent = data.state ? JSON.stringify(data.state, null, 2) : "ไม่พบข้อมูล State";
                } else {
                    appendBotMessage(`Error: ${data.detail || "ไม่สามารถติดต่อระบบได้"}`);
                }
            } catch (error) {
                removeLoadingMessage(loadingMessage);
                appendBotMessage("เกิดข้อผิดพลาดในการเชื่อมต่อ");
            } finally {
                setInputBusy(false);
                messageInput.focus();
            }
        }

        messageInput.addEventListener("input", function () {
            sendButton.classList.toggle("hidden", this.value.trim().length === 0);
        });

        messageInput.addEventListener("keypress", function (event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });

        sendButton.addEventListener("click", sendMessage);
        resetButton.addEventListener("click", resetSession);
        editSessionButton.addEventListener("click", beginSessionEdit);
        saveSessionButton.addEventListener("click", saveEditedSession);
        cancelSessionButton.addEventListener("click", cancelSessionEdit);

        sessionIdInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                saveEditedSession();
            }
            if (event.key === "Escape") {
                cancelSessionEdit();
            }
        });

        setSessionId(currentSessionId);
        displayCaNumber.textContent = loggedInCaNumber || "-";
        applyStatePanelPreference();
        if (loginReady) {
            initChat();
            registerCurrentSession();
            setInterval(pollNotifications, 2000);
        }
    </script>
</body>
</html>
