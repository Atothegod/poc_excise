services:
  db:
    image: postgres:17
    container_name: postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"

  # 1. เพิ่ม Redis Service (Message Broker สำหรับ Celery)
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: always

  oms:
    build:
      context: ./oms_api
      dockerfile: Dockerfile
    container_name: oms
    env_file:
      - .env
    environment:
      CA_CSV_PATH: /data/ca.csv
      DJANGO_OMS_EVENT_URL: http://backend:8000/api/oms/events/
      OMS_API_TOKEN: ${OMS_API_TOKEN:-}
    ports:
      - "8002:8000"
    volumes:
      - ./oms_api:/app
      - ./backend:/data:ro
    depends_on:
      backend:
        condition: service_started
      celery_worker:
        condition: service_started
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    env_file:
      - .env
    container_name: backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      dspy-agent:
        condition: service_healthy
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

  # 2. เพิ่ม Celery Worker Service (ใช้ Image เดียวกับ Backend)
  celery_worker:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: celery_worker
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      backend:
        condition: service_started
      dspy-agent:
        condition: service_healthy
    # รันคำสั่ง celery แทนการรันเซิร์ฟเวอร์ django
    command: celery -A pea_project worker -l info -Q celery --concurrency=2
    restart: always

  agent_job_worker:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: agent_job_worker
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      backend:
        condition: service_started
      dspy-agent:
        condition: service_healthy
    command: celery -A pea_project worker -l info -Q agent --concurrency=4
    restart: always

  dspy-agent:
    build: ./dspy
    container_name: dspy-agent
    ports:
      - "8001:8000" 
    volumes:               
      - ./dspy:/app        
    env_file:
      - .env
    command: uvicorn webhook_server:app --host 0.0.0.0 --port 8000 --workers 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: always


  flower:
      image: mher/flower
      container_name: celery_flower
      ports:
        - "5555:5555"
      environment:
        - CELERY_BROKER_URL=redis://redis:6379/0
      depends_on:
        - redis
        - celery_worker

volumes:
  postgres_data:
   
