services:
  db:
    image: postgres:17
    env_file: [.env]
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  dspy-agent:
    build: ./dspy
    env_file: [.env]
    environment:
      DJANGO_API_URL: http://backend:8000/api
    command: uvicorn webhook_server:app --host 0.0.0.0 --port 8000 --workers 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    env_file: [.env]
    environment:
      DJANGO_DEBUG: "False"
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      DSPY_AGENT_INTERNAL_URL: http://dspy-agent:8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn pea_project.wsgi:application --bind 0.0.0.0:8000
      --workers 3 --threads 4 --timeout 90 --access-logfile - --error-logfile -"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  timer_worker:
    build:
      context: ./backend
      dockerfile: dockerfile
    env_file: [.env]
    environment:
      DJANGO_DEBUG: "False"
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      DSPY_AGENT_INTERNAL_URL: http://dspy-agent:8000
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A pea_project worker -l info -Q celery --concurrency=2
    restart: unless-stopped

  agent_job_worker:
    build:
      context: ./backend
      dockerfile: dockerfile
    env_file: [.env]
    environment:
      DJANGO_DEBUG: "False"
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      DSPY_AGENT_INTERNAL_URL: http://dspy-agent:8000
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      dspy-agent:
        condition: service_healthy
    command: celery -A pea_project worker -l info -Q agent --concurrency=4
    restart: unless-stopped

  oms:
    build:
      context: ./oms_api
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      CA_CSV_PATH: /data/ca.csv
      DJANGO_OMS_EVENT_URL: http://backend:8000/api/oms/events/
    ports:
      - "8002:8000"
    volumes:
      - ./backend:/data:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  flower:
    image: mher/flower
    profiles: ["observability"]
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on: [redis]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
