services:
  db:
    image: postgres:17
    container_name: postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"

  # 1. เพิ่ม Redis Service (Message Broker สำหรับ Celery)
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: always

  oms:
    build:
      context: ./oms_api
      dockerfile: Dockerfile
    container_name: oms
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-myuser}:${POSTGRES_PASSWORD:-mypassword}@db:5432/${POSTGRES_DB:-mydb}
      CA_CSV_PATH: /app/ca_lat_lon_2.csv
      DJANGO_OMS_EVENT_URL: http://backend:8000/api/oms/events/
      CASE_LINK_RADIUS_KM: "0.5"
      MASS_OUTAGE_CONFIRMATION_COUNT: "3"
    ports:
      - "8002:8000"
    volumes:
      - ./oms_api:/app
    depends_on:
      - db
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    env_file:
      - .env
    container_name: backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis # แจ้งให้รอ Redis สตาร์ทก่อน
      - oms
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

  # 2. เพิ่ม Celery Worker Service (ใช้ Image เดียวกับ Backend)
  celery_worker:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: celery_worker
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - backend
    # รันคำสั่ง celery แทนการรันเซิร์ฟเวอร์ django
    command: celery -A pea_project worker -l info

  dspy-agent:
    build: ./dspy
    container_name: dspy-agent
    ports:
      - "8001:8000" 
    volumes:               
      - ./dspy:/app        
    env_file:
      - .env
    restart: always


  flower:
      image: mher/flower
      container_name: celery_flower
      ports:
        - "5555:5555"
      environment:
        - CELERY_BROKER_URL=redis://redis:6379/0
      depends_on:
        - redis
        - celery_worker

volumes:
  postgres_data:
   
