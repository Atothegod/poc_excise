<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMS Location Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
    <style>
        :root {
            color-scheme: light;
            --ink: #17202f;
            --muted: #667085;
            --line: #d7dde7;
            --panel: #ffffff;
            --panel-soft: #f6f8fb;
            --purple: #733190;
            --purple-dark: #54206c;
            --green: #15803d;
            --red: #b42318;
            --amber: #b54708;
            --blue: #2563eb;
            --magenta: #c026d3;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100dvh;
            background: #edf1f6;
            color: var(--ink);
            font-family: Inter, "Segoe UI", Tahoma, sans-serif;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .shell {
            min-height: 100dvh;
            display: grid;
            grid-template-rows: auto auto minmax(0, 1fr);
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 22px;
            background: var(--purple);
            color: #fff;
        }

        .brand h1 {
            margin: 0;
            font-size: 18px;
            line-height: 1.2;
            letter-spacing: 0;
        }

        .brand p {
            margin: 3px 0 0;
            color: rgba(255, 255, 255, 0.78);
            font-size: 12px;
        }

        .top-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .link-button,
        .primary-button,
        .ghost-button {
            border: 1px solid transparent;
            border-radius: 6px;
            padding: 9px 12px;
            font-weight: 700;
            text-decoration: none;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 36px;
        }

        .link-button {
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.24);
        }

        .primary-button {
            background: var(--purple);
            color: #fff;
        }

        .ghost-button {
            background: #fff;
            color: var(--ink);
            border-color: var(--line);
        }

        .toolbar {
            display: grid;
            grid-template-columns: minmax(240px, 1.5fr) repeat(2, minmax(140px, 0.7fr)) repeat(2, minmax(145px, 0.8fr)) auto auto;
            gap: 10px;
            align-items: end;
            padding: 14px 22px;
            border-bottom: 1px solid var(--line);
            background: var(--panel);
        }

        .field {
            display: grid;
            gap: 5px;
            min-width: 0;
        }

        .field label {
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0;
        }

        input,
        select {
            width: 100%;
            min-height: 38px;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 8px 10px;
            background: #fff;
            color: var(--ink);
        }

        .toggle-field {
            min-height: 38px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 4px;
            color: var(--ink);
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .toggle-field input {
            width: 18px;
            height: 18px;
            min-height: 18px;
            accent-color: var(--purple);
        }

        .workspace {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 360px;
            min-height: 0;
        }

        .map-wrap {
            position: relative;
            min-width: 0;
            min-height: 0;
            border-right: 1px solid var(--line);
        }

        #map {
            width: 100%;
            height: 100%;
            min-height: 520px;
        }

        .map-status {
            position: absolute;
            left: 18px;
            bottom: 18px;
            z-index: 500;
            max-width: min(460px, calc(100% - 36px));
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.94);
            color: var(--muted);
            box-shadow: 0 10px 28px rgba(23, 32, 47, 0.14);
            font-size: 13px;
        }

        .sidebar {
            min-height: 0;
            overflow: auto;
            background: var(--panel);
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1px;
            background: var(--line);
            border-bottom: 1px solid var(--line);
        }

        .metric {
            background: var(--panel-soft);
            padding: 14px;
            min-height: 82px;
        }

        .metric span {
            display: block;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
        }

        .metric strong {
            display: block;
            margin-top: 6px;
            font-size: 26px;
            line-height: 1;
        }

        .legend,
        .location-list {
            padding: 16px;
            border-bottom: 1px solid var(--line);
        }

        .legend h2,
        .location-list h2 {
            margin: 0 0 12px;
            font-size: 14px;
            letter-spacing: 0;
        }

        .legend-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: 13px;
        }

        .dot {
            width: 13px;
            height: 13px;
            border-radius: 999px;
            background: var(--dot-color);
            border: 2px solid #fff;
            box-shadow: 0 0 0 1px rgba(23, 32, 47, 0.2);
            flex: 0 0 auto;
        }

        .fast-dot {
            box-shadow: 0 0 0 2px var(--magenta);
        }

        .location-list {
            display: grid;
            gap: 10px;
        }

        .location-row {
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 10px 12px;
            background: #fff;
            display: grid;
            gap: 4px;
        }

        .location-row strong {
            font-size: 13px;
        }

        .location-row span {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.35;
        }

        .case-marker {
            width: 18px;
            height: 18px;
            border-radius: 999px;
            border: 3px solid #fff;
            display: block;
            background: var(--marker-color);
            box-shadow: 0 2px 10px rgba(23, 32, 47, 0.38);
        }

        .case-marker.fast-track {
            box-shadow: 0 0 0 3px rgba(192, 38, 211, 0.48), 0 2px 10px rgba(23, 32, 47, 0.38);
        }

        .popup {
            min-width: 240px;
            display: grid;
            gap: 8px;
            color: var(--ink);
        }

        .popup h3 {
            margin: 0;
            font-size: 15px;
            line-height: 1.3;
        }

        .popup dl {
            margin: 0;
            display: grid;
            grid-template-columns: 86px minmax(0, 1fr);
            gap: 4px 10px;
            font-size: 12px;
        }

        .popup dt {
            color: var(--muted);
            font-weight: 700;
        }

        .popup dd {
            margin: 0;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .popup a {
            color: var(--purple-dark);
            font-weight: 800;
            text-decoration: none;
        }

        @media (max-width: 1180px) {
            .toolbar {
                grid-template-columns: minmax(220px, 1fr) repeat(2, minmax(140px, 1fr)) auto auto;
            }
        }

        @media (max-width: 880px) {
            .toolbar {
                grid-template-columns: 1fr 1fr;
            }

            .workspace {
                grid-template-columns: 1fr;
                grid-template-rows: minmax(480px, 62dvh) auto;
            }

            .map-wrap {
                border-right: 0;
                border-bottom: 1px solid var(--line);
            }

            .sidebar {
                max-height: none;
            }
        }

        @media (max-width: 560px) {
            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .toolbar {
                grid-template-columns: 1fr;
                padding: 12px;
            }

            .summary {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <div class="brand">
                <h1>OMS Location Map</h1>
                <p>Customer locations, outage cases, and fast-track visibility</p>
            </div>
            <div class="top-actions">
                <a class="link-button" href="{{ ops_webhook_url }}">Webhook Console</a>
            </div>
        </header>

        <form class="toolbar" id="filterForm">
            <div class="field">
                <label for="searchInput">Filter</label>
                <input id="searchInput" name="search" type="search" placeholder="CA, customer name, PEA area, case ID, LV">
            </div>
            <div class="field">
                <label for="statusSelect">Status</label>
                <select id="statusSelect" name="status">
                    <option value="active">Active cases</option>
                    <option value="all">All statuses</option>
                    <option value="reported">Reported</option>
                    <option value="investigating">Investigating</option>
                    <option value="repairing">Repairing</option>
                    <option value="restored">Restored</option>
                </select>
            </div>
            <div class="field">
                <label for="caseTypeSelect">Case type</label>
                <select id="caseTypeSelect" name="case_type">
                    <option value="all">All types</option>
                    <option value="normal">Normal</option>
                    <option value="fast_track">Fast-track</option>
                </select>
            </div>
            <div class="field">
                <label for="createdFromInput">Created from</label>
                <input id="createdFromInput" name="created_from" type="date">
            </div>
            <div class="field">
                <label for="createdToInput">Created to</label>
                <input id="createdToInput" name="created_to" type="date">
            </div>
            <label class="toggle-field">
                <input id="showAllInput" name="show_all" type="checkbox">
                Show all
            </label>
            <button class="primary-button" type="submit">Apply</button>
            <button class="ghost-button" id="resetButton" type="button">Reset</button>
        </form>

        <main class="workspace">
            <section class="map-wrap">
                <div id="map"></div>
                <div class="map-status" id="mapStatus">Loading map data...</div>
            </section>
            <aside class="sidebar">
                <section class="summary" aria-label="Map summary">
                    <div class="metric"><span>Locations</span><strong id="metricLocations">0</strong></div>
                    <div class="metric"><span>Cases</span><strong id="metricCases">0</strong></div>
                    <div class="metric"><span>Active</span><strong id="metricActive">0</strong></div>
                    <div class="metric"><span>Fast-track</span><strong id="metricFast">0</strong></div>
                </section>
                <section class="legend">
                    <h2>Legend</h2>
                    <div class="legend-grid">
                        <div class="legend-item"><span class="dot" style="--dot-color:#dc2626"></span>Reported</div>
                        <div class="legend-item"><span class="dot" style="--dot-color:#f59e0b"></span>Investigating</div>
                        <div class="legend-item"><span class="dot" style="--dot-color:#2563eb"></span>Repairing</div>
                        <div class="legend-item"><span class="dot" style="--dot-color:#16a34a"></span>Restored</div>
                        <div class="legend-item"><span class="dot" style="--dot-color:#94a3b8"></span>No case</div>
                        <div class="legend-item"><span class="dot fast-dot" style="--dot-color:#2563eb"></span>Fast-track</div>
                    </div>
                </section>
                <section class="location-list">
                    <h2>Visible locations</h2>
                    <div id="locationList"></div>
                </section>
            </aside>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script>
        const DATA_URL = "{{ map_data_url }}";
        const OPS_WEBHOOK_URL = "{{ ops_webhook_url }}";
        const form = document.getElementById("filterForm");
        const resetButton = document.getElementById("resetButton");
        const mapStatus = document.getElementById("mapStatus");
        const locationList = document.getElementById("locationList");
        const metrics = {
            locations: document.getElementById("metricLocations"),
            cases: document.getElementById("metricCases"),
            active: document.getElementById("metricActive"),
            fast: document.getElementById("metricFast")
        };

        const map = L.map("map", {
            zoomControl: true,
            preferCanvas: true
        }).setView([13.7563, 100.5018], 6);

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        const clusterLayer = L.markerClusterGroup({
            showCoverageOnHover: false,
            maxClusterRadius: 46
        });
        map.addLayer(clusterLayer);

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function formatDateTime(value) {
            if (!value) return "-";
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return "-";
            return date.toLocaleString("th-TH", {
                dateStyle: "medium",
                timeStyle: "short"
            });
        }

        function markerIcon(marker) {
            const fastClass = marker.marker.is_fast_track ? " fast-track" : "";
            return L.divIcon({
                className: "",
                html: `<span class="case-marker${fastClass}" style="--marker-color:${marker.marker.color}"></span>`,
                iconSize: [18, 18],
                iconAnchor: [9, 9],
                popupAnchor: [0, -9]
            });
        }

        function popupHtml(marker) {
            const caseData = marker.case;
            const caseRows = caseData ? `
                <dt>Case</dt><dd>LV ${escapeHtml(caseData.lv_group_id || "-")}</dd>
                <dt>Status</dt><dd>${escapeHtml(caseData.status_display)}</dd>
                <dt>Type</dt><dd>${escapeHtml(caseData.case_type_display)}</dd>
                <dt>Customers</dt><dd>${escapeHtml(caseData.affected_count)}</dd>
                <dt>Created</dt><dd>${escapeHtml(formatDateTime(caseData.created_at))}</dd>
                <dt>Console</dt><dd><a href="${OPS_WEBHOOK_URL}?search=${encodeURIComponent(caseData.case_id)}&include_restored=true">Open case</a></dd>
            ` : `
                <dt>Case</dt><dd>No active case</dd>
            `;

            return `
                <div class="popup">
                    <h3>${escapeHtml(marker.customer_name || "Unknown customer")}</h3>
                    <dl>
                        <dt>CA</dt><dd>${escapeHtml(marker.ca_number)}</dd>
                        <dt>PEA area</dt><dd>${escapeHtml(marker.pea_area || "-")}</dd>
                        <dt>User type</dt><dd>${escapeHtml(marker.user_type || "-")}</dd>
                        <dt>Ready</dt><dd>${escapeHtml(marker.is_ready || "-")}</dd>
                        <dt>Lat/Lon</dt><dd>${escapeHtml(marker.latitude)}, ${escapeHtml(marker.longitude)}</dd>
                        ${caseRows}
                    </dl>
                </div>
            `;
        }

        function renderSummary(summary) {
            metrics.locations.textContent = summary.total_locations ?? 0;
            metrics.cases.textContent = summary.cases ?? 0;
            metrics.active.textContent = summary.active_cases ?? 0;
            metrics.fast.textContent = summary.fast_track_cases ?? 0;
        }

        function renderLocationList(markers) {
            const visible = markers.slice(0, 80);
            locationList.innerHTML = visible.map((marker) => {
                const caseLine = marker.case
                    ? `LV ${escapeHtml(marker.case.lv_group_id || "-")} · ${escapeHtml(marker.case.status_display)} · ${escapeHtml(marker.case.case_type_display)}`
                    : "No case";
                return `
                    <div class="location-row">
                        <strong>${escapeHtml(marker.ca_number)} · ${escapeHtml(marker.customer_name || "-")}</strong>
                        <span>${caseLine}</span>
                        <span>${escapeHtml(marker.pea_area || marker.address || "-")}</span>
                    </div>
                `;
            }).join("");

            if (markers.length > visible.length) {
                locationList.insertAdjacentHTML(
                    "beforeend",
                    `<div class="location-row"><span>Showing first ${visible.length} of ${markers.length} locations</span></div>`
                );
            }
        }

        function paramsFromForm() {
            const params = new URLSearchParams(new FormData(form));
            if (!document.getElementById("showAllInput").checked) {
                params.delete("show_all");
            } else {
                params.set("show_all", "true");
            }
            return params;
        }

        async function loadMarkers() {
            mapStatus.textContent = "Loading map data...";
            const response = await fetch(`${DATA_URL}?${paramsFromForm().toString()}`);
            if (!response.ok) {
                throw new Error(`Map API returned ${response.status}`);
            }

            const data = await response.json();
            clusterLayer.clearLayers();

            const bounds = [];
            for (const markerData of data.markers) {
                const latLng = [markerData.latitude, markerData.longitude];
                bounds.push(latLng);
                L.marker(latLng, { icon: markerIcon(markerData) })
                    .bindPopup(popupHtml(markerData), { maxWidth: 360 })
                    .addTo(clusterLayer);
            }

            renderSummary(data.summary || {});
            renderLocationList(data.markers || []);

            if (bounds.length) {
                map.fitBounds(bounds, { padding: [32, 32], maxZoom: 16 });
                mapStatus.textContent = `${bounds.length} locations loaded`;
            } else {
                map.setView([13.7563, 100.5018], 6);
                mapStatus.textContent = "No locations match current filters";
            }
        }

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            loadMarkers().catch((error) => {
                mapStatus.textContent = error.message;
            });
        });

        resetButton.addEventListener("click", () => {
            form.reset();
            document.getElementById("statusSelect").value = "active";
            document.getElementById("caseTypeSelect").value = "all";
            loadMarkers().catch((error) => {
                mapStatus.textContent = error.message;
            });
        });

        loadMarkers().catch((error) => {
            mapStatus.textContent = error.message;
        });
    </script>
</body>
</html>
