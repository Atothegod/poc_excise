networks:
  pea_network:
    driver: bridge

volumes:
  postgres-data:
  minio-data:

services:
  # 1. Database (Postgres)
  postgres:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - pea_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: &default-logging
      driver: "json-file"
      options:
        max-size: "10m"   
        max-file: "3"

  # 2. Prefect Server
  prefect-server:
    image: prefecthq/prefect:3-python3.11
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    env_file:
      - .env
    networks:
      - pea_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    logging: *default-logging

  # 3. JupyterLab
  jupyter:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    working_dir: /app/notebooks
    env_file:
      - .env
    command: bash /app/scripts/start-jupyter.sh
    networks:
      - pea_network
    depends_on:
      - prefect-server
    restart: always
    logging: *default-logging

  # 4. Prefect Worker
  prefect-worker:
    build: 
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    env_file:
      - .env
    command: bash scripts/start-worker.sh
    networks:
      - pea_network
    depends_on:
      - prefect-server
    restart: always
    logging: *default-logging
  
  # 5. MinIO
  minio:
    image: minio/minio:RELEASE.2023-10-16T04-13-43Z
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - pea_network
    restart: always
    logging: *default-logging